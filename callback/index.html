<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completing sign-in…</title>
  <style>
    html, body { margin: 0; height: 100%; background: #131313; color: #e5e2e1;
      font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
  </style>
  <script>
    // OAuth providers redirect to /callback?code=...  (a real path).
    // Flutter web uses hash routing, so forward everything into the hash route.
    (function () {
      var q = window.location.search || '';
      window.location.replace('/#/callback' + q);
    })();
  </script>
</head>
<body>Completing sign-in…</body>
</html>
