name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.song.sakhi --project-name song_sakhi .
          test -f android/app/build.gradle

      - name: Install custom AndroidManifest (deep link + mic permission)
        run: cp deploy/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk to 37 (required by permission_handler_android)
        run: |
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 37/' android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*flutter\.compileSdkVersion/compileSdk 37/' android/app/build.gradle
          grep -n "compileSdk" android/app/build.gradle

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target lib/main_mobile.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: song-sakhi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
