name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.song.sakhi --project-name song_sakhi .

      - name: Install custom AndroidManifest (deep link + mic permission)
        run: cp deploy/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install native screen-capture module (Kotlin)
        run: |
          MAIN=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          test -n "$MAIN" || { echo "MainActivity.kt not found in generated scaffold"; exit 1; }
          PKG_DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | awk '{print $2}')
          echo "Generated package: $PKG in $PKG_DIR"
          cp deploy/android/kotlin/*.kt "$PKG_DIR"/
          sed -i "s/^package .*/package $PKG/" "$PKG_DIR"/MainActivity.kt "$PKG_DIR"/CaptureService.kt
          head -n 1 "$PKG_DIR"/MainActivity.kt "$PKG_DIR"/CaptureService.kt

      - name: Bump compileSdk to 37 (required by permission_handler_android)
        run: |
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          sed -i -E 's/compileSdk[[:space:]]*flutter\.compileSdkVersion/compileSdk 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Turn off R8 minify (ML Kit optional script classes break it)
        run: |
          sed -i -E '0,/release[[:space:]]*\{/s//release {\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle.kts

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        # --no-shrink: ML Kit's optional script classes make R8 fail on a release build
        run: flutter build apk --release --no-shrink --target lib/main_mobile.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: song-sakhi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
